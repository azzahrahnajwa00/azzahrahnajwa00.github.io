<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ikon Najwa Az Zahrah">
  <defs>
    <linearGradient id="fav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="55%" stop-color="#224dfe"/>
      <stop offset="100%" stop-color="#00b4ff"/>
    </linearGradient>
  </defs>

  <!-- kotak membulat dengan gradasi biru -->
  <rect width="64" height="64" rx="15" fill="url(#fav)"/>

  <!-- kilau lembut di kiri atas -->
