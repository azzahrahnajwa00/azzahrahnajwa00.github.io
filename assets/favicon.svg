  <!-- monogram NZ -->
  <text x="32" y="44" font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="32" font-weight="700" text-anchor="middle"
        fill="#ffffff" letter-spacing="-1">NZ</text>
</svg>
